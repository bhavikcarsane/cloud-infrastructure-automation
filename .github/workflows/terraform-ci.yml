name: Terraform CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_admin_cidr: ${{ vars.ADMIN_CIDR }}
  TF_VAR_ssh_public_key_path: "~/.ssh/kloudbuild-project1.pub"

jobs:

  terraform-plan:

    name: Terraform Validate and Plan

    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: terraform/environments/dev

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: terraform-ci-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Prepare SSH public key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ vars.SSH_PUBLIC_KEY }}" > ~/.ssh/kloudbuild-project1.pub

      - name: Create backend configuration
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          key          = "project1/dev/terraform.tfstate"
          region       = "${{ vars.AWS_REGION }}"
          use_lockfile = true
          EOF

      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -input=false -no-color
